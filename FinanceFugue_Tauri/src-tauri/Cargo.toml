[package]
name = "financefugue-tauri"
version = "29.7.2026"
description = "FinanceFugue Desktop Client Manager (Tauri / Rust Edition)"
authors = ["kir-spec"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
fs2 = "0.4"
zip = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
open = "5.1"
dirs = "5.0"
tauri-plugin-dialog = "2.7.2"
sha2 = "0.11.0"

[profile.release]
panic = "abort"
codegen-units = 16
lto = "thin"
opt-level = "s"
strip = true
