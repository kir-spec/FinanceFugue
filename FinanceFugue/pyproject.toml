[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "F841"]

[tool.ruff.lint.per-file-ignores]
"src/main_window.py" = ["E501"]
"src/widgets/order_widget.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/qt"]
markers = ["qt: Qt GUI tests (pytest-qt)"]
