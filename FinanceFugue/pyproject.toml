[project]
name = "FinanceFugue"
version = "1.0.0"
description = "Десктопная CRM для управления клиентами и заказами (PySide6)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Kirill Fandeev", email = "KVF_SOFT@mail.ru" },
]
license = { text = "Proprietary" }
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: Other/Proprietary License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial",
    "Topic :: Database :: Front-Ends",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "F841"]

[tool.ruff.lint.per-file-ignores]
"src/main_window.py" = ["E501"]
"src/widgets/order_widget.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["qt: Qt GUI tests (pytest-qt)"]

[tool.mypy]
python_version = "3.11"
# mixin-паттерн: каждый mixin добавляет атрибуты через ``self``,
# mypy не разрешает такие cross-mixin атрибуты. Подавляем
# только ``attr-defined`` (false positives), не отключаем целиком.
disable_error_code = ["attr-defined"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "build", "dist"]
# B404/B603/B606/B607: ``subprocess``/``os.startfile`` — это основной
# функционал десктопного приложения (открытие файлов пользователя).
# Все пути проходят через safe_resolve_within.
# B404/B603/B606/B607: subprocess/os.startfile — основной функционал desktop.
# B110: try/except/pass в crash_handler оправдано (обработчик не должен падать).
skips = ["B404", "B603", "B606", "B607", "B110"]
